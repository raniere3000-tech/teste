*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#102840}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

.eyebrow{color:#9fe1e7;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-size:12px;color:#bfe0eb;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#fca5a5;display:inline-block}
.sync.on i{background:#86efac}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;color:#c8d6e5;font:600 14px var(--f);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#16a5b8}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #16a5b8;outline-offset:2px}
main{padding-block:20px 48px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--marinho);color:var(--card);border-color:var(--marinho)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--kpi-f);border:1px solid var(--line);border-top:3px solid var(--marinho);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font:600 24px var(--fc);color:var(--marinho);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--azul-claro)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}

.card h3{margin:0;font-size:15px;color:var(--marinho);text-wrap:balance}
.meta-line{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pct{font:600 26px var(--fc);font-variant-numeric:tabular-nums;color:var(--marinho)}
.prog{height:8px;background:var(--trilho);border-radius:4px;overflow:hidden}

.prog.low>i{background:var(--laranja)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--info-f);color:var(--info-t);white-space:nowrap}

.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:600 13px var(--f);cursor:pointer}

.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--tint);color:var(--blue)}
.btn.sm{padding:5px 10px;font-size:12px}
.mlist{display:flex;flex-direction:column;gap:10px}
.meta{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start}
.meta .cod{font:600 13px var(--fc);background:var(--marinho);color:var(--card);border-radius:4px;padding:3px 7px}
.meta h4{margin:0;font-size:14px;font-weight:600}
.meta .right{text-align:right;font-variant-numeric:tabular-nums}

.meta .body{grid-column:2/4;display:flex;flex-direction:column;gap:6px;min-width:0}
.como{color:var(--azul-claro);font-size:13px}
.comp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;background:var(--zebra);border-radius:4px;padding:6px 8px}
.comp .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.comp .prog{grid-column:1/3;height:5px}
.evs{display:flex;flex-wrap:wrap;gap:6px}
.ev{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px;background:var(--card);color:var(--ink);max-width:100%}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}

.uso-como{color:var(--ink);font-size:13px;margin-top:2px}

.fill{display:flex;flex-direction:column;gap:8px;min-width:0}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.ghead{font:600 12px var(--f);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 2px}
.banner{background:var(--at-f);color:var(--at-t);border:1px solid var(--at-b);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1A2740;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v, d = 2) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d });
const pc = v => v == null ? '—' : Math.round(v * 100) + '%';
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }

// ---- cálculo ----
const CAP = 1.2;
function atComp(indId, alvo) {
  const v = st.vals[indId]?.v; if (v == null || v === '') return null;
  const d = IND[indId].dir; let r;
  if (d > 0) r = alvo ? v / alvo : 0; else r = v <= 0 ? CAP : alvo / v;
  return Math.max(0, Math.min(CAP, r));
}
function atMeta(m) { const a = m.comps.map(([i, t]) => atComp(i, t)).filter(x => x != null); return a.length ? a.reduce((s, x) => s + x, 0) / m.comps.length : null; }
function atCargo(c) {
  const tp = c.metas.reduce((s, m) => s + m.peso, 0); let acc = 0, n = 0;
  c.metas.forEach(m => { const a = atMeta(m); if (a != null) { acc += m.peso * a; n++; } });
  return { pct: acc / tp, filled: n, total: c.metas.length };
}
const usos = {}; CARGOS.forEach(c => c.metas.forEach(m => m.comps.forEach(([i, t]) => (usos[i] ||= []).push({ c, m, t }))));
const evsOf = indId => st.evs[indId] || [];
const extOf = n => (n.split('.').pop() || '').toLowerCase();

function renderCargos() {
  const list = CARGOS.filter(c => !st.area || c.area === st.area);

  const indFilled = Object.keys(usos).filter(i => st.vals[i]?.v != null && st.vals[i]?.v !== '').length;
  const nEv = Object.values(st.evs).reduce((s, a) => s + a.length, 0);
  $('#kpis').innerHTML = [
    [CARGOS.length, 'cargos com plano de metas'],

    [pc(media), 'atingimento médio ponderado'],
    [nEv, 'evidências anexadas']].map(([b, s]) => `<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');
  $('#areas').innerHTML = ['', 'Serviços', 'Comercial', 'VCG'].map(a => `<button class="chip" data-area="${a}" aria-pressed="${st.area === a}">${a || 'Todas as áreas'}</button>`).join('');
  $('#cards').innerHTML = list.map(c => {
    const r = atCargo(c); const ne = new Set(c.metas.flatMap(m => m.comps.flatMap(([i]) => evsOf(i).map(e => e.id)))).size;
    return `<button class="card" data-cargo="${c.id}" aria-current="${st.sel === c.id}">
      <div class="meta-line"><span class="tag ${c.area}">${c.area}</span>${c.pessoa ? `<span>${esc(c.pessoa)}</span>` : ''}</div>
      <h3>${esc(c.nome)}</h3>
      <div class="pct">${pc(r.pct)}</div>
      <div class="prog ${r.pct < .5 && r.filled ? 'low' : ''}"><i style="width:${Math.min(100, r.pct * 100)}%"></i></div>
      <div class="meta-line"><span>${r.filled} de ${r.total} metas com resultado</span><span>· ${ne} evidência${ne === 1 ? '' : 's'}</span></div></button>`;
  }).join('');
  renderDetail();
}
function compLine(i, t) {
  const I = IND[i], a = atComp(i, t), v = st.vals[i]?.v;
  return `<div class="comp"><span>${esc(I.nome)}${I.dir < 0 ? ' <span class="unit">(quanto menor, melhor)</span>' : ''}</span>
    <span class="num">${nf(v)} / ${nf(t)} <span class="unit">${esc(I.un)}</span> · <b>${pc(a)}</b></span>
    <div class="prog ${a != null && a < .5 ? 'low' : ''}"><i style="width:${Math.min(100, (a || 0) * 100)}%"></i></div></div>`;
}
function evChips(list, rm) {
  return list.length ? `<div class="evs">${list.map(e => `<span class="ev"><span class="ext ${extOf(e.nome)}">${esc(extOf(e.nome).toUpperCase())}</span><span title="${esc(e.nome)}">${esc(e.nome)}</span><button data-dl="${e.id}" aria-label="Baixar ${esc(e.nome)}">baixar</button>${rm ? `<button class="x" data-rm="${e.id}" aria-label="Remover ${esc(e.nome)}">remover</button>` : ''}</span>`).join('')}</div>` : '<span class="empty">Sem evidências anexadas</span>';
}
function renderDetail() {
  const c = CARGOS.find(x => x.id === st.sel); const el = $('#detail');
  if (!c) { el.innerHTML = '<p class="empty" style="margin-top:16px">Clique em um cartão para ver as metas, pesos, resultados e evidências do cargo.</p>'; return; }
  const r = atCargo(c);
  const allEv = uniqEv(c);
  el.innerHTML = `<div class="detail" id="det"><div class="dhead"><div><div class="meta-line"><span class="tag ${c.area}">${c.area}</span><span>Aba do Excel: ${esc(c.aba)}</span>${c.pessoa ? `<span>· ${esc(c.pessoa)}</span>` : ''}</div>
    <h2>${esc(c.nome)} · ${pc(r.pct)}</h2></div>
    <div class="frow"><button class="btn ghost sm" data-goto="${c.id}">Preencher metas deste cargo</button><button class="btn" data-zip="${c.id}" ${allEv.length ? '' : 'disabled'}>Baixar evidências (${allEv.length})</button></div></div>
    <div class="mlist">${c.metas.map(m => { const a = atMeta(m); const ev = [...new Map(m.comps.flatMap(([i]) => evsOf(i)).map(e => [e.id, e])).values()];
      return `<div class="meta"><span class="cod">${m.c}</span><h4>${m.c} – ${esc(m.t)}</h4>
      <div class="right"><b>${pc(a)}</b><small>peso ${nf(m.peso * 100, 0)}% · contribui ${a == null ? '—' : nf(a * m.peso * 100, 1) + ' p.p.'}</small></div>
      <div class="body"><div class="como"><b>Como:</b> ${esc(m.como)}</div>
      <div class="meta-line"><span>Prazo: ${esc(m.prazo)}</span><span>· Aferição: ${esc(m.instr)}</span></div>
      ${m.comps.map(([i, t]) => compLine(i, t)).join('')}
      ${evChips(ev, false)}</div></div>`; }).join('')}</div></div>`;
}
function uniqEv(c) { return [...new Map(c.metas.flatMap(m => m.comps.flatMap(([i]) => evsOf(i).map(e => [e.id, { ...e, m: m.c }])))).values()]; }

// ---- render: preenchimento ----
function msLabel() { const n = st.pick.size; $('#ms-lbl').textContent = n === CARGOS.length ? 'Todos os cargos' : n === 0 ? 'Nenhum cargo' : n === 1 ? CARGOS.find(c => st.pick.has(c.id)).nome : n + ' cargos selecionados'; }
function renderPop() {
  const areas = ['Serviços', 'Comercial', 'VCG'];
  $('#ms-pop').innerHTML = `<div class="acts"><button class="btn sm ghost" data-pk="all">Marcar todos</button><button class="btn sm ghost" data-pk="none">Limpar</button>${areas.map(a => `<button class="btn sm ghost" data-pk="${a}">Só ${a}</button>`).join('')}</div>` +
    areas.map(a => `<div class="grp">${a}</div>` + CARGOS.filter(c => c.area === a).map(c => `<label><input type="checkbox" id="pk-${c.id}" data-cg="${c.id}" ${st.pick.has(c.id) ? 'checked' : ''}> ${esc(c.nome)}</label>`).join('')).join('');
}
function renderFill() {
  msLabel();
  const g = $('#f-grupo').value, s = $('#f-status').value, q = $('#f-busca').value.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const ids = Object.keys(usos).filter(i => usos[i].some(u => st.pick.has(u.c.id)));
  const rows = DATA.ind.filter(I => ids.includes(I.id)).filter(I => {
    if (g && I.grupo !== g) return false;
    const has = st.vals[I.id]?.v != null && st.vals[I.id]?.v !== '';
    if (s === 'pend' && has) return false; if (s === 'ok' && !has) return false;
    if (q) { const hay = (I.nome + ' ' + usos[I.id].map(u => u.m.t + ' ' + u.c.nome).join(' ')).toLowerCase().normalize('NFD').replace(/\p{M}/gu, ''); if (!hay.includes(q)) return false; }
    return true;
  });
  const nMetas = CARGOS.filter(c => st.pick.has(c.id)).reduce((x, c) => x + c.metas.length, 0);
  $('#p-count').textContent = `${rows.length} indicador${rows.length === 1 ? '' : 'es'} para preencher, cobrindo ${nMetas} metas dos cargos marcados. Cada valor e cada evidência entram uma vez e aparecem em todos os cargos que usam o indicador.`;
  let lastG = '';
  $('#ilist').innerHTML = rows.map(I => {
    const v = st.vals[I.id] || {}; const has = v.v != null && v.v !== '';
    const us = usos[I.id].filter(u => st.pick.has(u.c.id)); const outros = usos[I.id].length - us.length;
    const alvos = [...new Set(usos[I.id].map(u => u.t))];
    const head = I.grupo !== lastG ? `<div class="ghead">${esc(I.grupo)}</div>` : ''; lastG = I.grupo;
    return head + `<div class="irow ${has ? 'done' : ''}" id="row-${I.id}"><div style="min-width:0">
      <h4>${esc(I.nome)}</h4>
      <div class="meta-line"><span>Unidade: ${esc(I.un)}</span><span>· Alvo${alvos.length > 1 ? 's' : ''}: ${alvos.map(a => nf(a)).join(' / ')}</span>${I.dir < 0 ? '<span>· quanto menor, melhor</span>' : ''}</div>
      <div class="usos">${us.map(u => `<div class="uso"><div class="uso-cg"><b>${esc(u.c.nome)}</b> · peso ${nf(u.m.peso * 100, 0)}%${alvos.length > 1 ? ` · alvo ${nf(u.t)} → ${pc(atComp(I.id, u.t))}` : ''}${u.m.comps.length > 1 ? ` · <span class="tag">preenchida automaticamente com: ${u.m.comps.map(([k]) => esc(IND[k].nome)).join(' + ')}</span>` : ''}</div><div class="uso-meta">${u.m.c} – ${esc(u.m.t)}</div><div class="uso-como"><b>Como:</b> ${esc(u.m.como)}</div></div>`).join('')}
      ${outros ? `<div class="uso">+ ${outros} meta${outros > 1 ? 's' : ''} em cargos não marcados</div>` : ''}</div></div>
      <div class="fill">
        <div class="frow"><input type="number" step="any" inputmode="decimal" id="v-${I.id}" data-val="${I.id}" value="${has ? v.v : ''}" placeholder="Realizado" aria-label="Realizado de ${esc(I.nome)}"><span class="unit">${esc(I.un)}</span>
          ${has ? `<span class="state ok">${pc(atComp(I.id, I.alvo))} do alvo ${nf(I.alvo)}</span>` : '<span class="state at">Pendente</span>'}</div>
        <div class="frow"><input type="text" id="o-${I.id}" data-obs="${I.id}" value="${esc(v.obs || '')}" placeholder="Observação (mês de referência, fonte…)" aria-label="Observação"></div>
        ${v.em ? `<span class="empty">Atualizado em ${new Date(v.em).toLocaleString('pt-BR')}</span>` : ''}
        ${evChips(evsOf(I.id), true)}
        <label class="btn ghost sm up" for="f-${I.id}">Anexar Excel, Word ou PDF<input type="file" id="f-${I.id}" data-up="${I.id}" multiple accept=".xlsx,.xls,.xlsm,.csv,.docx,.doc,.pdf,.png,.jpg,.jpeg,.pptx"></label>
      </div></div>`;
  }).join('') || '<p class="empty">Nenhum indicador com esses filtros.</p>';
}
function render() { renderCargos(); if (st.tab === 'preencher') renderFill(); }

// ---- ações ----
async function saveVal(id, patch) {
  const cur = { ...(st.vals[id] || {}), ...patch, em: Date.now() };
  if (user) try { cur.por = await user.id(); } catch {}
  st.vals[id] = cur;
  if (db) { try { await db.doc('valores/' + id).set(cur); } catch (e) { toast('Não foi possível salvar: ' + (e.message || e.code), true); return; } }
  toast(live ? 'Salvo' : 'Salvo só nesta tela (sem conexão com o banco)');
  render();
}
const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
async function upload(indId, files) {
  if (!assets || !db) { toast('Para anexar, abra o painel no claude.ai como editor.', true); return; }
  for (const f of files) {
    try {
      toast('Enviando ' + f.name + '…');
      const txt = b64(await f.arrayBuffer());
      const r = await assets.upload(new Blob([txt], { type: 'text/plain' }), { type: 'text/plain' });
      const id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const doc = { ind: indId, nome: f.name, size: f.size, asset: r.id, em: Date.now() };
      await db.doc('evid/' + id).set(doc);
      if (!live) { (st.evs[indId] ||= []).push({ id, ...doc }); render(); }
      toast('Anexado: ' + f.name);
    } catch (e) { toast('Falha ao anexar ' + f.name + ': ' + (e.message || e.code), true); }
  }
}
function findEv(id) { for (const a of Object.values(st.evs)) { const e = a.find(x => x.id === id); if (e) return e; } }
async function fetchBytes(e) {
  const r = await fetch('/_blob/' + e.asset); if (!r.ok) throw new Error('arquivo não encontrado');
  const bin = atob((await r.text()).trim()); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u;
}
async function save(filename, data) {
  if (!downloads) { toast('Download indisponível nesta visualização.', true); return; }
  try { await downloads.save({ filename, data }); } catch (e) { if (e.code !== 'declined') toast('Download não concluído: ' + (e.message || e.code), true); }
}
async function dlOne(id) { const e = findEv(id); if (!e) return; try { await save(e.nome, new Blob([await fetchBytes(e)])); } catch (er) { toast(er.message, true); } }
async function dlZip(cid) {
  const c = CARGOS.find(x => x.id === cid); const list = uniqEv(c); if (!list.length) return;
  if (!window.JSZip) { toast('Compactador não carregou. Baixe as evidências uma a uma.', true); return; }
  toast('Montando o .zip com ' + list.length + ' arquivo(s)…');
  const z = new JSZip(); const nomes = new Set();
  for (const e of list) {
    const metas = c.metas.filter(m => m.comps.some(([i]) => i === e.ind)).map(m => m.c).join('-');
    let n = `${metas} - ${e.nome}`; let k = 1; while (nomes.has(n)) n = `${metas} - (${++k}) ${e.nome}`; nomes.add(n);
    try { z.file(n, await fetchBytes(e)); } catch { toast('Pulei ' + e.nome + ' (arquivo não encontrado)', true); }
  }
  const blob = await z.generateAsync({ type: 'blob' });
  await save(`Evidências 2026 - ${c.nome.replace(/[\\/:*?"<>|()]/g, '')}.zip`, blob);
}
async function removeEv(id) {
  const e = findEv(id); if (!e) return;
  const btn = document.querySelector(`[data-rm="${id}"]`);
  if (btn && btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'confirmar remoção'; return; }
  try { if (db) await db.doc('evid/' + id).delete(); if (assets) assets.delete(e.asset).catch(() => {}); if (!live) { st.evs[e.ind] = evsOf(e.ind).filter(x => x.id !== id); render(); } toast('Evidência removida'); }
  catch (er) { toast('Não foi possível remover: ' + (er.message || er.code), true); }
}
function setTab(t) {
  st.tab = t; document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#v-cargos').hidden = t !== 'cargos'; $('#v-preencher').hidden = t !== 'preencher';
  try { localStorage.setItem('metas-tab', t); } catch {}
  render();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button,[data-cg]'); if (!t) { if (!ev.target.closest('#ms')) $('#ms-pop').hidden = true; return; }
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.area != null) { st.area = t.dataset.area; return renderCargos(); }
  if (t.dataset.cargo) { st.sel = st.sel === t.dataset.cargo ? null : t.dataset.cargo; renderCargos(); if (st.sel) $('#det')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.zip) return dlZip(t.dataset.zip);
  if (t.dataset.dl) return dlOne(t.dataset.dl);
  if (t.dataset.rm) return removeEv(t.dataset.rm);
  if (t.dataset.goto) { st.pick = new Set([t.dataset.goto]); renderPop(); return setTab('preencher'); }
  if (t.id === 'ms-btn') { const p = $('#ms-pop'); p.hidden = !p.hidden; t.setAttribute('aria-expanded', !p.hidden); if (!p.hidden) renderPop(); return; }
  if (t.dataset.pk) { const k = t.dataset.pk; st.pick = new Set(k === 'all' ? CARGOS.map(c => c.id) : k === 'none' ? [] : CARGOS.filter(c => c.area === k).map(c => c.id)); renderPop(); return renderFill(); }
  if (!t.closest('#ms')) $('#ms-pop').hidden = true;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.cg) { t.checked ? st.pick.add(t.dataset.cg) : st.pick.delete(t.dataset.cg); return renderFill(); }
  if (t.dataset.val) { const raw = t.value.trim(); return saveVal(t.dataset.val, { v: raw === '' ? null : Number(raw) }); }
  if (t.dataset.obs) return saveVal(t.dataset.obs, { obs: t.value });
  if (t.dataset.up) { upload(t.dataset.up, [...t.files]); t.value = ''; return; }
  if (t.id === 'f-grupo' || t.id === 'f-status') renderFill();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset?.val) ev.target.blur(); if (ev.key === 'Escape') $('#ms-pop').hidden = true; });
$('#f-busca').addEventListener('input', () => renderFill());
$('#f-grupo').innerHTML += [...new Set(DATA.ind.map(i => i.grupo))].map(g => `<option>${esc(g)}</option>`).join('');

function setSync(on, txt) { const s = $('#sync'); s.classList.toggle('on', on); s.querySelector('span').textContent = txt; }
async function boot() {
  try { const t = localStorage.getItem('metas-tab'); if (t) st.tab = t; } catch {}
  setTab(st.tab);
  if (!window.claude?.use) { setSync(false, 'Sem conexão: valores não são salvos'); $('#banner').hidden = false; $('#banner').innerHTML = 'Esta cópia do GitHub só mostra as metas. Para gravar resultados e anexar evidências, use a <a href="https://claude.ai/artifact/6WNK6U6H3QJYcgdRESvqYC" target="_blank" rel="noopener">versão no claude.ai</a>.'; return; }
  const timer = setTimeout(() => { if (!live) setSync(false, 'Sem resposta do banco de dados'); }, 10000);
  [db, assets, downloads, user] = await Promise.all(['db', 'assets', 'downloads', 'user'].map(n => claude.use(n).catch(() => null)));
  if (!db) { clearTimeout(timer); setSync(false, 'Somente leitura'); $('#banner').hidden = false; $('#banner').textContent = 'Entre no claude.ai com acesso ao painel para salvar resultados e anexar evidências.'; return; }
  const onErr = e => { setSync(false, 'Erro de conexão: ' + (e.code || '')); };
  db.collection('valores').onSnapshot(snap => { clearTimeout(timer); live = true; st.vals = {}; snap.docs.forEach(d => st.vals[d.id] = d.data()); setSync(true, 'Salvo na nuvem'); keepFocus(render); }, onErr);
  db.collection('evid').onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { const x = d.data(); (m[x.ind] ||= []).push({ id: d.id, ...x }); }); Object.values(m).forEach(a => a.sort((p, q) => p.em - q.em)); st.evs = m; keepFocus(render); }, onErr);
}
function keepFocus(fn) { const a = document.activeElement; const id = a?.id; const editing = a && (a.tagName === 'INPUT' && (a.type === 'number' || a.type === 'text')); if (editing && st.tab === 'preencher') { renderCargos(); return; } fn(); if (id) document.getElementById(id)?.focus?.(); }
boot();
</script>
</body>
</html>
